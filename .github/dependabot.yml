version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    groups:
      # Group routine dev-tooling bumps into one PR to keep review volume sane.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Runtime patches are grouped; majors and minors still arrive individually
      # so each one gets looked at properly.
      runtime-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
