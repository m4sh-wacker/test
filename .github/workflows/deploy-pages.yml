name: Deploy to GitHub Pages

# The steps below turn Pages on if it is not already, and set its source to this
# workflow, so a fresh repository or a fork needs no manual setup. The equivalent
# by hand is Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress. Let it finish, then run the next one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install clean packages
        run: npm clean-install

      - name: Build
        run: npm run build

      # CNAME claims decodebox.owasp.org, which only the canonical repository is
      # entitled to. Shipping it from a fork points that fork's Pages site at a
      # domain it does not control, and the result is a site that serves
      # nothing. A fork should deploy to its own github.io URL instead, which
      # works because the build uses relative asset paths.
      - name: Drop the custom domain outside the canonical repository
        if: github.repository != 'OWASP/DecodeBox'
        run: rm -f dist/CNAME

      - name: Verify the build is static and complete
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          if [ "$GITHUB_REPOSITORY" = "OWASP/DecodeBox" ]; then
            test -f dist/CNAME || echo "::warning::dist/CNAME is missing - the custom domain will not be applied"
          fi
          # The application must never call out to a third party at runtime. This is a
          # coarse check, but it catches an accidental CDN reference before it ships.
          if grep -rIloE 'https?://(cdn|unpkg|jsdelivr)' dist --include='*.js' --include='*.html' | head -1 | grep -q .; then
            echo "::error::Found a CDN reference in the build output. DecodeBox must make no runtime network requests."
            exit 1
          fi

      # Pages remembers how it was first switched on, and "deploy from a branch"
      # is what you get by enabling it by hand to grab a URL. This workflow then
      # builds, uploads and deploys an artifact that is never served: the site
      # keeps returning the repository's own index.html, which points at
      # /src/main.tsx and renders a blank page. Every check is green and the
      # site is empty, which is a miserable thing to debug.
      #
      # `configure-pages` will create a site but will not change an existing
      # one's build type, so say it outright. Idempotent, and it degrades to a
      # warning where the token is not allowed to.
      - name: Make sure Pages builds from this workflow, not from a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            || echo "::warning::Could not set the Pages build type. Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions' by hand, or this deploy will not be served."

      # `enablement` turns Pages on for a repository that has never had it,
      # rather than failing the first push with "Get Pages site failed". A fork
      # or a fresh clone of this repository then deploys without anyone having
      # to find the setting first.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
