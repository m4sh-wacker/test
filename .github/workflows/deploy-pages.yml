name: Deploy to GitHub Pages

# Pages has to be set to build from a workflow for any of this to be served:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions. A
# repository that has never had Pages at all is switched on automatically below;
# one already set to deploy from a branch cannot be changed from here, so the
# build stops and says so rather than deploying into a void.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress. Let it finish, then run the next one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install clean packages
        run: npm clean-install

      - name: Build
        run: npm run build

      # CNAME claims decodebox.owasp.org, which only the canonical repository is
      # entitled to. Shipping it from a fork points that fork's Pages site at a
      # domain it does not control, and the result is a site that serves
      # nothing. A fork should deploy to its own github.io URL instead, which
      # works because the build uses relative asset paths.
      - name: Drop the custom domain outside the canonical repository
        if: github.repository != 'OWASP/DecodeBox'
        run: rm -f dist/CNAME

      - name: Verify the build is static and complete
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          if [ "$GITHUB_REPOSITORY" = "OWASP/DecodeBox" ]; then
            test -f dist/CNAME || echo "::warning::dist/CNAME is missing - the custom domain will not be applied"
          fi
          # The application must never call out to a third party at runtime. This is a
          # coarse check, but it catches an accidental CDN reference before it ships.
          if grep -rIloE 'https?://(cdn|unpkg|jsdelivr)' dist --include='*.js' --include='*.html' | head -1 | grep -q .; then
            echo "::error::Found a CDN reference in the build output. DecodeBox must make no runtime network requests."
            exit 1
          fi

      # Pages remembers how it was first switched on, and "deploy from a branch"
      # is what you get by enabling it by hand to grab a URL. This workflow then
      # builds, uploads and deploys an artifact that is never served: the site
      # keeps returning the repository's own index.html, which points at
      # /src/main.tsx and renders a blank page.
      #
      # This workflow cannot correct that by itself. Changing the build type
      # needs repository administration rights, and administration is not one of
      # the permissions a workflow is able to request, so the default token is
      # refused however it is configured. Reading the setting is allowed, so read
      # it and stop here, naming the one setting a person has to change.
      #
      # Failing rather than warning is the point. The previous version of this
      # step only warned, and a warning inside a green run is indistinguishable
      # from nothing at all: the site was blank for an afternoon while every
      # check passed.
      - name: Check Pages builds from this workflow, not from a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unreadable)
          case "$kind" in
            workflow)
              echo "Pages builds from a workflow."
              ;;
            unreadable)
              # Also the answer for a repository with no Pages site yet, which
              # the Configure Pages step below is about to create correctly.
              echo "::notice::Could not read the Pages configuration. Continuing; the deployment is checked once it lands."
              ;;
            *)
              echo "::error::Pages is set to '$kind', so it serves this repository's source rather than this build and the site renders blank. Open Settings -> Pages -> Build and deployment and set Source to 'GitHub Actions'. Nothing in this workflow is permitted to change it."
              exit 1
              ;;
          esac

      # `enablement` turns Pages on for a repository that has never had it,
      # rather than failing the first push with "Get Pages site failed". A fork
      # or a fresh clone of this repository then deploys without anyone having
      # to find the setting first.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # A deployment reports success once the artifact has been handed over.
      # Whether the site then serves it is a separate question, and the answer
      # was no for an entire afternoon while this workflow reported success. So
      # ask the site, which is the only thing that actually knows.
      - name: Verify the site serves this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSL --max-time 30 "$PAGE_URL" || true)
            case "$body" in
              *src/main.tsx*)
                echo "::error::$PAGE_URL is serving this repository's source index.html instead of the build, so the page is blank. Pages is deploying from a branch: set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions'."
                exit 1
                ;;
              *assets/index-*.js*)
                echo "$PAGE_URL is serving the built application."
                exit 0
                ;;
            esac
            echo "Attempt $attempt did not see a settled page yet."
            sleep 15
          done
          echo "::error::$PAGE_URL never returned a recognisable build. Open it and see what it is serving."
          exit 1
